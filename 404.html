<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Not Found · Lag0n URLs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --surface-2: #1c1c1f;
      --border: #2a2a2e;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #a78bfa;
      --accent-hover: #c4b5fd;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    header {
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .logo {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }

    .logo span {
      color: var(--accent);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card-404 {
      max-width: 420px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      text-align: center;
    }

    .preview {
      aspect-ratio: 16 / 10;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .preview img {
      max-width: 160px;
      max-height: 160px;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .card-body {
      padding: 1.25rem 1.35rem 1.5rem;
    }

    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.35rem;
    }

    .title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .msg {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.15rem;
      line-height: 1.5;
    }

    .path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      word-break: break-all;
      margin-bottom: 1.15rem;
      opacity: 0.85;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #0a0a0b;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #252528;
    }

    footer {
      margin-top: 3.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .container {
        padding: 1.75rem 1rem 3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Lag0n<span> URLs</span></div>
      <p class="subtitle">Image & asset index · packs, filters & direct links</p>
    </header>

    <div class="card-404">
      <div class="preview">
        <img src="/assets/404.svg" alt="404" width="160" height="160" />
      </div>
      <div class="card-body">
        <div class="code">404</div>
        <div class="title">Page not found</div>
        <p class="msg">This URL doesn’t exist or the asset was moved.</p>
        <p class="path" id="path"></p>
        <div class="actions">
          <a class="btn btn-primary" href="/">Back home</a>
          <a class="btn btn-secondary" href="/">Browse blooks</a>
        </div>
      </div>
    </div>

    <footer>
      Powered by <a href="https://github.com/Lag0ndev/Lag0n-urls" target="_blank" rel="noopener">Lag0n-urls</a>
    </footer>
  </div>

  <script>
    document.getElementById('path').textContent = location.pathname + location.search;
  </script>
</body>
</html>

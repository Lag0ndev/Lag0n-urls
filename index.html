<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lag0n URLs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --surface-2: #1c1c1f;
      --border: #2a2a2e;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #a78bfa;
      --accent-hover: #c4b5fd;
      --success: #34d399;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .logo {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }

    .logo span {
      color: var(--accent);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem 1.1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stat strong {
      color: var(--text);
      font-weight: 600;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.55rem 1.15rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover {
      border-color: #3f3f46;
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0a0a0b;
    }

    .search-wrap {
      margin-bottom: 1.75rem;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1.1rem 0.85rem 2.8rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
    }

    .search-wrap input::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .back-bar {
      display: none;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .back-bar.visible {
      display: flex;
    }

    .back-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.15s;
    }

    .back-btn:hover {
      background: #252528;
    }

    .pack-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .pack-meta {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-left: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      border-color: #3f3f46;
      transform: translateY(-2px);
    }

    .card.clickable {
      cursor: pointer;
    }

    .card.clickable:hover {
      border-color: var(--accent);
    }

    .preview {
      aspect-ratio: 16 / 10;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 0.75rem;
    }

    .preview .placeholder {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-align: center;
      padding: 1rem;
    }

    .pack-cover {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: linear-gradient(145deg, #1e1b2e 0%, #141416 50%, #1a1525 100%);
      position: relative;
    }

    .pack-cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 30% 40%, rgba(167, 139, 250, 0.18), transparent 50%),
        radial-gradient(circle at 70% 70%, rgba(52, 211, 153, 0.1), transparent 45%);
    }

    .pack-icon {
      font-size: 2.75rem;
      line-height: 1;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    }

    .pack-label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      position: relative;
      z-index: 1;
    }

    .card-body {
      padding: 1rem 1.1rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      flex: 1;
    }

    .filename {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      word-break: break-all;
    }

    .pack-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }

    .pack-count {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      word-break: break-all;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      margin-top: auto;
      padding-top: 0.4rem;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.5rem 0.7rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #0a0a0b;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #252528;
    }

    .btn.copied {
      background: var(--success);
      color: #0a0a0b;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1.5rem;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: var(--text-muted);
    }

    .empty h3 {
      color: var(--text);
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .empty code {
      font-family: 'JetBrains Mono', monospace;
      background: var(--surface-2);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    footer {
      margin-top: 3.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .container {
        padding: 1.75rem 1rem 3rem;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Lag0n<span> URLs</span></div>
      <p class="subtitle">Image & asset index · packs, filters & direct links</p>
      <div class="stats">
        <div class="stat"><strong id="count">0</strong> <span id="count-label">assets</span></div>
        <div class="stat">Base: <strong id="base-url">—</strong></div>
      </div>
    </header>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="blooks">Blooks</button>
      <button class="filter-btn" data-filter="packs">Packs</button>
      <button class="filter-btn" data-filter="other">Other</button>
    </div>

    <div class="search-wrap" id="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="search" id="search" placeholder="Search by filename or pack..." autocomplete="off" />
    </div>

    <div class="back-bar" id="back-bar">
      <button class="back-btn" id="back-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </button>
      <span class="pack-title" id="pack-title"></span>
      <span class="pack-meta" id="pack-meta"></span>
    </div>

    <div class="grid" id="grid">
      <!-- cards injected by JS -->
    </div>

    <footer>
      Powered by <a href="https://github.com/Lag0ndev/Lag0n-urls" target="_blank" rel="noopener">Lag0n-urls</a>
    </footer>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const countEl = document.getElementById('count');
    const countLabel = document.getElementById('count-label');
    const baseUrlEl = document.getElementById('base-url');
    const searchInput = document.getElementById('search');
    const filtersEl = document.getElementById('filters');
    const backBar = document.getElementById('back-bar');
    const backBtn = document.getElementById('back-btn');
    const packTitleEl = document.getElementById('pack-title');
    const packMetaEl = document.getElementById('pack-meta');

    const base = window.location.origin;
    baseUrlEl.textContent = base;

    // Pack definitions (assets belong to packs)
    const PACKS = [
      {
        id: 'hat-pack',
        name: 'Hat Pack',
        icon: '🎩',
        cover: 'placeholderblook.svg',
        description: 'Classic baseball hats',
        assets: ['ladodgershat.svg', 'oaklandashat.svg']
      }
    ];

    let allAssets = [];          // flat list from assets.json
    let currentFilter = 'blooks'; // blooks | packs | other
    let activePack = null;       // pack object when drilled in

    async function loadAssets() {
      try {
        const res = await fetch('/assets.json');
        if (!res.ok) throw new Error('no assets.json');
        allAssets = await res.json();
      } catch (e) {
        allAssets = [];
      }
      applyView();
    }

    function getPackAssetSet() {
      const set = new Set();
      PACKS.forEach(p => p.assets.forEach(a => set.add(a)));
      return set;
    }

    function getOtherAssets() {
      const inPack = getPackAssetSet();
      return allAssets.filter(a => {
        const name = typeof a === 'string' ? a : a.name;
        return !inPack.has(name);
      });
    }

    function applyView() {
      const q = searchInput.value.trim().toLowerCase();

      if (activePack) {
        // Pack detail view
        let list = activePack.assets;
        if (q) {
          list = list.filter(name => name.toLowerCase().includes(q));
        }
        renderAssets(list, { packMode: true });
        return;
      }

      if (currentFilter === 'packs') {
        let packs = PACKS;
        if (q) {
          packs = packs.filter(p =>
            p.name.toLowerCase().includes(q) ||
            p.assets.some(a => a.toLowerCase().includes(q))
          );
        }
        renderPacks(packs);
      } else if (currentFilter === 'other') {
        // intentionally empty for now
        renderAssets([]);
      } else {
        // blooks (all individual assets)
        let list = allAssets;
        if (q) {
          list = list.filter(a => {
            const name = typeof a === 'string' ? a : a.name;
            return name.toLowerCase().includes(q);
          });
        }
        renderAssets(list);
      }
    }

    function renderPacks(packs) {
      countEl.textContent = packs.length;
      countLabel.textContent = packs.length === 1 ? 'pack' : 'packs';
      backBar.classList.remove('visible');

      if (packs.length === 0) {
        grid.innerHTML = `
          <div class="empty">
            <h3>No packs found</h3>
            <p>Try a different search or switch filters.</p>
          </div>`;
        return;
      }

      grid.innerHTML = packs.map(pack => `
        <div class="card clickable" data-pack="${pack.id}" onclick="openPack('${pack.id}')">
          <div class="preview">
            ${pack.cover
              ? `<img src="${base}/assets/${pack.cover}" alt="${pack.name}" loading="lazy" onerror="this.onerror=null;this.src='${base}/assets/placeholderblook.svg'" />`
              : `<div class="pack-cover">
              <div class="pack-icon">${pack.icon || '📦'}</div>
              <div class="pack-label">Pack</div>
            </div>`}
          </div>
          <div class="card-body">
            <div class="pack-name">${pack.name}</div>
            <div class="pack-count">${pack.assets.length} asset${pack.assets.length === 1 ? '' : 's'} · ${pack.description || ''}</div>
            <div class="actions">
              <button class="btn btn-primary" onclick="event.stopPropagation(); openPack('${pack.id}')">Open Pack</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderAssets(list, opts = {}) {
      countEl.textContent = list.length;
      countLabel.textContent = list.length === 1 ? 'asset' : 'assets';

      if (opts.packMode && activePack) {
        backBar.classList.add('visible');
        packTitleEl.textContent = activePack.name;
        packMetaEl.textContent = `${list.length} of ${activePack.assets.length}`;
      } else {
        backBar.classList.remove('visible');
      }

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="empty">
            <h3>${opts.packMode ? 'No matching assets in this pack' : 'No assets yet'}</h3>
            <p>${opts.packMode
              ? 'Try clearing the search.'
              : 'Drop images into the <code>assets/</code> folder,<br>then add their filenames to <code>assets.json</code> and push.'}</p>
          </div>`;
        return;
      }

      grid.innerHTML = list.map(item => {
        const name = typeof item === 'string' ? item : item.name;
        const url = `${base}/assets/${name}`;
        const isImage = /\.(png|jpe?g|gif|webp|svg|avif|bmp|ico)$/i.test(name);

        return `
          <div class="card" data-name="${name.toLowerCase()}">
            <div class="preview">
              ${isImage
                ? `<img src="${url}" alt="${name}" loading="lazy" onerror="this.onerror=null;this.src='${base}/assets/placeholderblook.svg'" />`
                : `<div class="placeholder">${name.split('.').pop()?.toUpperCase() || 'FILE'}</div>`}
            </div>
            <div class="card-body">
              <div class="filename">${name}</div>
              <div class="url">${url}</div>
              <div class="actions">
                <a class="btn btn-primary" href="${url}" target="_blank" rel="noopener">Open</a>
                <button class="btn btn-secondary" onclick="copyUrl('${url}', this)">Copy</button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function openPack(id) {
      activePack = PACKS.find(p => p.id === id) || null;
      if (activePack) {
        searchInput.value = '';
        applyView();
      }
    }

    function closePack() {
      activePack = null;
      applyView();
    }

    function copyUrl(url, btn) {
      navigator.clipboard.writeText(url).then(() => {
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = original;
          btn.classList.remove('copied');
        }, 1600);
      });
    }

    // Filter buttons
    filtersEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      currentFilter = btn.dataset.filter;
      activePack = null;
      filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
      searchInput.value = '';
      applyView();
    });

    backBtn.addEventListener('click', closePack);

    searchInput.addEventListener('input', () => applyView());

    loadAssets();
  </script>
</body>
</html>

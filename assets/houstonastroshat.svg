<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Houston Astros Hat</title>
  <defs>
    <clipPath id="frame-clip">
      <rect width="512" height="512" rx="77"/>
    </clipPath>
    <!-- Soft shadow under brim -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <!-- Subtle fabric texture -->
    <pattern id="fabric" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#0a1f38"/>
      <path d="M0 8 L8 0" stroke="#0d2744" stroke-width="0.6"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame-clip)">
    <!-- Background -->
    <rect width="512" height="512" fill="#0b1220"/>

    <!-- Grounding shadow ellipse -->
    <ellipse cx="256" cy="455" rx="150" ry="18" fill="#000" opacity="0.35"/>

    <!-- ===== HAT GROUP ===== -->
    <g transform="translate(256 250)" filter="url(#softShadow)">

      <!-- Crown (main navy body) -->
      <path d="
        M -120,-95
        C -120,-155  -70,-190  0,-195
        C  70,-190  120,-155  120,-95
        L  125,-20
        C  125,25   90,55   0,58
        C -90,55  -125,25  -125,-20
        Z
      " fill="#0C2340"/>

      <!-- Fabric texture overlay on crown -->
      <path d="
        M -120,-95
        C -120,-155  -70,-190  0,-195
        C  70,-190  120,-155  120,-95
        L  125,-20
        C  125,25   90,55   0,58
        C -90,55  -125,25  -125,-20
        Z
      " fill="url(#fabric)" opacity="0.35"/>

      <!-- Panel stitch lines (subtle) -->
      <g stroke="#163a5c" stroke-width="1.2" fill="none" opacity="0.55">
        <path d="M 0,-195 L 0,58"/>
        <path d="M -55,-185 Q -40,-60 -30,50"/>
        <path d="M  55,-185 Q  40,-60  30,50"/>
        <path d="M -95,-140 Q -75,-40 -70,30"/>
        <path d="M  95,-140 Q  75,-40  70,30"/>
      </g>

      <!-- Top button -->
      <circle cx="0" cy="-195" r="9" fill="#081828"/>
      <circle cx="0" cy="-195" r="5.5" fill="#0C2340"/>
      <circle cx="0" cy="-197" r="2" fill="#1a3a5c" opacity="0.7"/>

      <!-- Brim (flat bill) -->
      <path d="
        M -145,35
        C -145,35  -155,55  -150,78
        C -140,105  -80,118  0,118
        C  80,118  140,105  150,78
        C  155,55  145,35  145,35
        C  100,55   50,62   0,62
        C -50,62 -100,55 -145,35
        Z
      " fill="#0a1f38"/>

      <!-- Brim top edge highlight -->
      <path d="
        M -145,35
        C -100,55 -50,62 0,62
        C 50,62 100,55 145,35
      " fill="none" stroke="#1a3f66" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

      <!-- Brim underside curve shadow -->
      <path d="
        M -140,55
        C -90,78 -40,88 0,88
        C 40,88 90,78 140,55
      " fill="none" stroke="#061018" stroke-width="8" opacity="0.4"/>

      <!-- ===== ASTROS LOGO (front panel) ===== -->
      <g transform="translate(0,-55)">
        <!-- Orange star (6-point / starburst like Astros) -->
        <g>
          <!-- Outer star points -->
          <path d="
            M 0,-52
            L 10,-16 L 48,-16 L 18,6
            L 28,42 L 0,20 L -28,42
            L -18,6 L -48,-16 L -10,-16
            Z
          " fill="#FF6600"/>
          <!-- Slightly darker inner for depth -->
          <path d="
            M 0,-40
            L 7.5,-12 L 36,-12 L 13.5,4.5
            L 21,32 L 0,15 L -21,32
            L -13.5,4.5 L -36,-12 L -7.5,-12
            Z
          " fill="#FF7A1A" opacity="0.9"/>
        </g>

        <!-- White H over star -->
        <g fill="#FFFFFF">
          <!-- Left vertical -->
          <rect x="-16" y="-28" width="10" height="56" rx="1.5"/>
          <!-- Right vertical -->
          <rect x="6" y="-28" width="10" height="56" rx="1.5"/>
          <!-- Crossbar -->
          <rect x="-16" y="-4" width="32" height="11" rx="1"/>
        </g>
      </g>

      <!-- New Era side flag (right side of crown) -->
      <g transform="translate(95,-30) scale(0.85)">
        <rect x="-6" y="-10" width="18" height="14" rx="1.5" fill="#FFFFFF"/>
        <text x="3" y="2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
              font-size="9" font-weight="700" fill="#0C2340">NE</text>
      </g>

      <!-- Subtle crown highlight (left-top) -->
      <ellipse cx="-40" cy="-130" rx="45" ry="25" fill="#ffffff" opacity="0.06"/>
    </g>
  </g>
</svg>
